# Configuración mínima para la CLI de Supabase (npx supabase ...).
project_id = "botiquin"

[functions.asistente]
# El gateway de Supabase exige un JWT válido antes de llegar a la función.
verify_jwt = true

[auth]
# URL pública de la app (GitHub Pages) y adónde puede volver Google después del login.
site_url = "https://wlacaze-git.github.io/botiquin/"
additional_redirect_urls = ["https://wlacaze-git.github.io/botiquin/", "http://localhost:8000/"]
minimum_password_length = 8

[auth.email]
# Sin email de confirmación: con email + contraseña se entra directo (el plan gratis manda muy pocos emails).
enable_confirmations = false


[auth.external.google]
# Credenciales en .env.local (no se suben). Cliente OAuth "Web application" en Google Cloud.
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
